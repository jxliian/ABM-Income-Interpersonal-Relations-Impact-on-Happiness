name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy openpyxl "mesa<3.0" pyinstaller
        pip list

    - name: Build Executable
      run: |
        python build_app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ABM_Happiness_Tool_Windows
        path: dist/ABM_Happiness_Tool.exe
        retention-days: 5
